# Build VitePress and deploy to GitHub Pages + self-hosted nginx.
name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: yarn install
      - name: Build with VitePress
        run: yarn docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Extract artifact
        run: |
          mkdir -p site
          tar -xf artifact/*.tar -C site
          echo "Site layout:"
          du -sh site
          du -sh site/*/ 2>/dev/null || true
          ls -la site | head -40

      # 1) hashed JS/CSS first — new HTML must never 404 mid-deploy
      - name: Sync assets (hashed JS/CSS)
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rltgoDzvO'
          SOURCE: site/assets/
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          TARGET: /usr/share/nginx/html/assets/

      # 2) pages / chunks, skip the heavy image tree
      - name: Sync pages (exclude img)
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rltgoDzvO --exclude=img --exclude=assets'
          SOURCE: site/
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          TARGET: /usr/share/nginx/html/

      # 3) baseline images without large note albums
      - name: Sync img except notes
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rltgoDzvO --exclude=notes'
          SOURCE: site/img/
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          TARGET: /usr/share/nginx/html/img/

      # 4) note albums one folder at a time (smallest → largest)
      - name: Sync note image folders in batches
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          RSYNC_RSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          REMOTE="${REMOTE_USER}@${REMOTE_HOST}"
          TARGET_ROOT=/usr/share/nginx/html

          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=no "$REMOTE" \
            "mkdir -p $TARGET_ROOT/img/notes"

          if [ ! -d site/img/notes ]; then
            echo "No site/img/notes directory, skip."
            exit 0
          fi

          # Sort by size ascending so the site recovers sooner.
          mapfile -t FOLDERS < <(
            find site/img/notes -mindepth 1 -maxdepth 1 -type d -printf '%s\t%p\n' \
              | sort -n \
              | cut -f2-
          )

          for folder in "${FOLDERS[@]}"; do
            name="$(basename "$folder")"
            size="$(du -sh "$folder" | cut -f1)"
            echo "::group::Sync notes/$name ($size)"
            rsync -rltgoDzvO --partial --timeout=120 -e "$RSYNC_RSH" \
              "$folder/" "$REMOTE:$TARGET_ROOT/img/notes/$name/"
            echo "::endgroup::"
          done

      # 5) prune orphans after everything is already on the server.
      # Already-synced files should be skipped by size/mtime; this mainly deletes old hashes.
      - name: Final prune with --delete
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-rltgoDzvO --delete'
          SOURCE: site/
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
          TARGET: /usr/share/nginx/html/
